{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">CUSTOMER ACCESS</span><h2>Create your account</h2><p class="text-secondary">Register to view your shipments and track deliveries.</p>
<form method="post"><div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="name" required></div><div class="mb-3"><label class="form-label">Email address</label><input class="form-control" type="email" name="email" required></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required><div class="form-text">At least 8 characters.</div></div><button class="btn btn-primary w-100">Create account</button></form></div></div>{% endblock %}
