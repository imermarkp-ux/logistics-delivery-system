{% extends "base.html" %}{% block title %}New shipment{% endblock %}
{% block content %}<div class="page-heading"><div><span class="eyebrow">SHIPMENT MANAGEMENT</span><h2>Create shipment</h2><p class="text-secondary mb-0">Add package details and delivery information.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('shipments') }}">Cancel</a></div>
<div class="content-card form-card mt-4"><form method="post"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Customer account *</label><select class="form-select" name="customer_id" required><option value="">Select customer</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }} · {{ c.email }}</option>{% endfor %}</select><div class="form-text">Create a customer account first under Users or ask the customer to register.</div></div>
<div class="col-md-6"><label class="form-label">Assign rider</label><select class="form-select" name="rider_id"><option value="">Not assigned</option>{% for r in riders %}<option value="{{ r.id }}">{{ r.name }} · {{ r.email }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Recipient name *</label><input class="form-control" name="recipient_name" required></div><div class="col-md-6"><label class="form-label">Recipient phone</label><input class="form-control" name="recipient_phone"></div>
<div class="col-md-6"><label class="form-label">Origin / pickup address *</label><input class="form-control" name="origin" required></div><div class="col-md-6"><label class="form-label">Destination address *</label><input class="form-control" name="destination" required></div>
<div class="col-12"><label class="form-label">Package description</label><textarea class="form-control" rows="3" name="package_description" placeholder="Example: Small box, documents, fragile item..."></textarea></div>
</div><div class="mt-4"><button class="btn btn-primary">Create shipment</button></div></form></div>{% endblock %}
